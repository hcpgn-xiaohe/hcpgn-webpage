<body>

    <!-- 关于页 -->

      <p data-i18n="about.p3">感谢您对盒鸽 HcDove的支持与关注！</p>
    </section>

  <div class="divider-1px"></div>

  <!-- 底部 -->
  <footer class="footer">
    <div data-i18n="footer.contact">联系我们</div>
    <div class="social-icons">
      <a href="https://space.bilibili.com/1016692202/" title="Bilibili" data-i18n-title="social.bilibili" target="_blank" rel="noopener">
        <img src="/images/bilibili.png" alt="Bilibili" class="social-icon">
      </a>
      <a href="https://www.douyin.com/user/MS4wLjABAAAAALiqkpu3Zp8I56vEpV46mEreYBIA2jFqRk-wSPZqOVbE/" title="Douyin" data-i18n-title="social.douyin" target="_blank" rel="noopener">
        <img src="/images/douyin.png" alt="Douyin" class="social-icon">
      </a>
    </div>
    <div class="font-credit">
      <span data-i18n="footer.font">本网站使用</span>
      <a href="https://hyperos.mi.com/font/" target="_blank" rel="noopener">MiSans</a>
      <span data-i18n="footer.fontSuffix">字体</span>
    </div>
  </footer>

  <script>
    /**
     * 多语言 SPA 应用
     * 统一管理中英文界面，无刷新切换
     */

    // ========== 语言数据 ==========
    const locales = {
      zh: {
        nav: { home: '主页', games: '游戏', ai: 'AI', about: '关于' },
        home: { subtitle: '专注于游戏和科技的团队', description: '成立于2022年，致力于为用户带来优质的游戏体验和科技产品' },
        games: { title: '游戏', comingSoon: '更多游戏敬请期待', godot: '学习使用Godot' },
        ai: { title: 'AI', agent: 'AI智能体', tools: 'AI工具', comingSoon: '更多内容敬请期待', tage: '塔鸽', lifechecklist: '人生已完成清单' },
        about: { title: '关于我们', p1: '盒鸽 HcDove成立于2022年，是一个专注于游戏和科技的团队。', p2: '我们致力于通过技术创新，为用户带来优质的游戏体验和科技产品。', p3: '感谢您对盒鸽 HcDove的支持与关注！' },
        footer: { contact: '联系我们', font: '本网站使用', fontSuffix: '字体' },
        meta: { description: '盒鸽 HcDove - 专注于游戏和科技的团队' },
        social: { bilibili: '哔哩哔哩', douyin: '抖音' }
      },
      en: {
        nav: { home: 'Home', games: 'Games', ai: 'AI', about: 'About' },
        home: { subtitle: 'Focused on games and technology', description: 'Founded in 2022, dedicated to bringing high-quality gaming experiences and technology products' },
        games: { title: 'Games', comingSoon: 'More games coming soon', godot: 'Study to use Godot' },
        ai: { title: 'AI', agent: 'AI Agents', tools: 'AI Tools', comingSoon: 'More coming soon', tage: 'Tage', lifechecklist: 'Life Checklist' },
        about: { title: 'About Us', p1: 'HcDove was founded in 2022, focusing on games and technology.', p2: 'We are committed to bringing high-quality gaming experiences and technology products.', p3: 'Thank you for your support and attention to HcDove!' },
        footer: { contact: 'Contact Us', font: 'This website uses', fontSuffix: 'font' },
        meta: { description: 'HcDove - Focused on games and technology' },
        social: { bilibili: 'Bilibili', douyin: 'Douyin' }
      }
    };

    // ========== i18n 核心 ==========
    class I18n {
      constructor() {
        const browserLang = navigator.language.startsWith('en') ? 'en' : 'zh';
        this.currentLang = localStorage.getItem('hcpgn-lang') || browserLang;
        this.translations = locales;
        this.listeners = [];
      }

      getNestedValue(obj, path) {
        return path.split('.').reduce((acc, part) => acc && acc[part], obj);
      }

      t(key) {
        const val = this.getNestedValue(this.translations[this.currentLang], key);
        return val !== undefined ? val : key;
      }

      setLang(lang) {
        if (!this.translations[lang]) return;
        this.currentLang = lang;
        localStorage.setItem('hcpgn-lang', lang);
        this.updateDOM();
        this.updateLangButtons();
        this.updateMeta();
        this.listeners.forEach(fn => fn(lang));
        this.updatePageTitle();
      }

      getLang() { return this.currentLang; }

      onChange(fn) { this.listeners.push(fn); }

      updateDOM() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.dataset.i18n;
          if (key) el.textContent = this.t(key);
        });
        document.querySelectorAll('[data-i18n-title]').forEach(el => {
          const key = el.dataset.i18nTitle;
          if (key) el.title = this.t(key);
        });
      }

      updateLangButtons() {
        document.querySelectorAll('.lang-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.lang === this.currentLang);
        });
        document.documentElement.lang = this.currentLang === 'zh' ? 'zh-CN' : 'en-US';
      }
      
      updateMeta() {
        // 更新 meta description
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) {
          metaDesc.content = this.t('meta.description');
        }
      }

      updatePageTitle() {
        const titles = {
          zh: { home: '主页 - 盒鸽 HcDove', games: '游戏 - 盒鸽 HcDove', ai: 'AI - 盒鸽 HcDove', about: '关于 - 盒鸽 HcDove' },
          en: { home: 'Home - HcDove', games: 'Games - HcDove', ai: 'AI - HcDove', about: 'About - HcDove' }
        };
        document.title = titles[this.currentLang][App.state.currentPage] || titles[this.currentLang].home;
      }
    }

    const i18n = new I18n();

    // ========== SPA 应用 ==========
    window.App = {
      state: { currentPage: 'home' },

      init() {
        // 初始化时检查 URL hash
        const hash = window.location.hash.slice(1);
        if (hash) {
          // 支持 #home-zh, #home-zh-cn 等格式，提取基础页面名
          const pageMatch = hash.match(/^([a-z]+?)(?:-[a-z]+)?$/);
          const page = pageMatch ? pageMatch[1] : hash;
          if (document.getElementById(`page-${page}`)) {
            this.navigateTo(page);
          }
        }
        
        i18n.updateDOM();
        i18n.updateLangButtons();
        this.bindEvents();
        console.log('[SPA] 初始化完成，当前语言:', i18n.getLang());
      },

      bindEvents() {
        // 语言切换
        document.querySelectorAll('.lang-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            i18n.setLang(e.target.dataset.lang);
          });
        });

        // 导航切换
        document.querySelectorAll('[data-page]').forEach(link => {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            const page = e.target.dataset.page || e.target.closest('[data-page]')?.dataset.page;
            if (page) this.navigateTo(page);
          });
        });

        // 汉堡菜单
        const hamburger = document.querySelector('.hamburger');
        const navMenu = document.querySelector('.nav-menu');
        hamburger?.addEventListener('click', () => {
          hamburger.classList.toggle('active');
          navMenu.classList.toggle('active');
        });

        // 点击菜单外部关闭
        document.addEventListener('click', (e) => {
          if (!hamburger?.contains(e.target) && !navMenu?.contains(e.target)) {
            hamburger?.classList.remove('active');
            navMenu?.classList.remove('active');
          }
        });

        // Hash 导航支持
        window.addEventListener('hashchange', () => {
          const hash = window.location.hash.slice(1);
          if (hash) {
            // 支持 #home-zh, #home-zh-cn 等格式，提取基础页面名
            const pageMatch = hash.match(/^([a-z]+?)(?:-[a-z]+)?$/);
            const page = pageMatch ? pageMatch[1] : hash;
            if (document.getElementById(`page-${page}`)) {
              this.navigateTo(page);
            }
          }
        });
      },

      navigateTo(page) {
        if (!document.getElementById(`page-${page}`)) return;
        
        // 隐藏所有页面
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        
        // 显示目标页面
        const targetPage = document.getElementById(`page-${page}`);
        targetPage.classList.add('active');
        
        // 更新导航高亮
        document.querySelectorAll('[data-page]').forEach(link => {
          link.classList.toggle('active', link.dataset.page === page);
        });
        
        this.state.currentPage = page;
        
        // 更新 hash（不带语言后缀）
        if (window.location.hash !== `#${page}`) {
          history.replaceState(null, '', `#${page}`);
        }
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
        i18n.updatePageTitle();
      }
    };

    // 启动
    document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
  <!-- Banner轮播组件 -->
  <script src="/js/banner-slider.js?v=1.0.9.1"></script>
  <script>
    function initBanner() {
      const slider = new BannerSlider({
        container: '#banner-slider',
        autoPlay: true,
        interval: 5000
      });
      
      // 语言切换时更新banner标题
      i18n.onChange(() => {
        slider.updateLang();
      });
      
      return slider;
    }

    document.addEventListener('DOMContentLoaded', () => {
      initBanner();
    });
  </script>
</body>
</html>
