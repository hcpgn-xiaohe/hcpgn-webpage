<!doctype html>
<!-- 声明HTML5文档类型 -->
<html lang="en-US">
  <!-- 文档根元素，指定语言为美国英语 -->
  <head>
    <!-- 文档元信息区域 -->

    <!-- 文档字符编码声明 -->
    <meta http-equiv="content-Type" content="text/html; charset=utf-8" />

    <!-- 响应式视口设置（移动端关键配置） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 多语言版本声明 -->
    <link rel="alternate" hreflang="zh-CN" href="/zh-cn/about/" />
    <link rel="alternate" hreflang="en-US" href="/en-us/about/" />

    <!-- 默认语言版本 -->
    <link rel="alternate" hreflang="x-default" href="/zh-cn/about/" />

    <!-- 页面标题（SEO核心要素） -->
    <title>About - 盒鸽 HcDove</title>

    <!-- 页面描述（SEO核心要素） -->
    <meta
      name="description"
      content="HcDove - Focused on games and technology"
    />
    <!-- 页面关键词（SEO核心要素） -->
    <meta name="keywords" content="HcDove,games,technology,team" />

    <!-- 外部CSS样式表引用（带版本号控制缓存） -->
    <link rel="stylesheet" href="/css/style.css?v=1.0.8.4" />
    <!-- 网站图标引用 -->
    <link
      rel="icon"
      href="/images/logo.svg"
      type="image/svg+xml"
      sizes="32x32"
    />
    <link rel="apple-touch-icon" href="/images/logo.svg" />
    <!-- 导航脚本 -->
    <script src="/js/navigation.js?v=1.0.8.4"></script>
    <!-- 组件加载器 -->
    <script src="/js/component-loader.js?v=1.0.8.4"></script>
  </head>

  <body>
    <!-- 导航栏占位符 -->
    <div id="navbar-placeholder"></div>

    <!-- 页面主内容区域 -->
    <main class="content">
      <!-- 主标题（SEO关键词重点） -->
      <h1>About Us</h1>
      <!-- 内容描述 -->
      <p>HcDove was founded in 2022, focusing on games and technology.</p>
      <p>
        We are committed to bringing high-quality gaming experiences and
        technology products to users through technological innovation.
      </p>
      <p>Thank you for your support and attention to HcDove!</p>
    </main>

    <!-- 1px辅助分割线（内容间隔） -->
    <div class="divider-1px"></div>

    <!-- 底部占位符 -->
    <div id="footer-placeholder"></div>
  </body>
</html>
