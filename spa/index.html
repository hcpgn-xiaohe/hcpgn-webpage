<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="盒鸽 HcDove - 专注于游戏和科技的团队">
  <meta name="keywords" content="盒鸽,HcDove,游戏,科技,团队">
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml" sizes="32x32">
  <link rel="apple-touch-icon" href="/images/logo.svg">
  <link rel="stylesheet" href="/css/style.css?v=1.0.8.4">
  <title>盒鸽 HcDove</title>
  <style>
    /* SPA 相关样式 */
    .page { display: none; }
    .page.active { display: block; }
    .page-transition { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <header class="navbar">
    <a href="#" class="nav-item" data-page="home">
      <img src="/images/logo.svg" alt="Logo" class="logo">
    </a>
    <button class="hamburger" aria-label="菜单">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>
    <div class="nav-menu">
      <div class="nav-links">
        <a href="#" class="nav-item" data-page="home" data-i18n="nav.home">主页</a>
        <a href="#" class="nav-item" data-page="games" data-i18n="nav.games">游戏</a>
        <a href="#" class="nav-item" data-page="ai" data-i18n="nav.ai">AI制作</a>
        <a href="#" class="nav-item" data-page="about" data-i18n="nav.about">关于</a>
      </div>
      <div class="lang-switch">
        <a href="#" class="lang-btn active" data-lang="zh">中</a>
        <span class="or1">|</span>
        <a href="#" class="lang-btn" data-lang="en">En</a>
      </div>
    </div>
  </header>

  <!-- 页面容器 -->
  <main id="app">
    <!-- 首页 -->
    <section id="page-home" class="page active page-transition">
      <h1>盒鸽 HcDove</h1>
      <p data-i18n="home.subtitle">专注于游戏和科技的团队</p>
      <p data-i18n="home.description">成立于2022年，致力于为用户带来优质的游戏体验和科技产品</p>
    </section>

    <!-- 游戏页 -->
    <section id="page-games" class="page">
      <h1 data-i18n="games.title">游戏</h1>
      <div class="games">
        <a href="/zh-cn/games/index.html" class="game" target="_blank">
          <img src="/images/logo.svg" alt="Game" class="game-icon">
          <div class="game-title" data-i18n="games.comingSoon">更多游戏敬请期待</div>
        </a>
      </div>
    </section>

    <!-- AI页 -->
    <section id="page-ai" class="page">
      <h1 data-i18n="ai.title">AI制作</h1>
      <div class="games">
        <a href="/zh-cn/ai/人生已完成清单.html" class="game" target="_blank" rel="noopener">
          <img src="/images/人生已完成清单.png" alt="人生已完成清单" class="game-icon">
          <div class="game-title">人生已完成清单</div>
        </a>
      </div>
    </section>

    <!-- 关于页 -->
    <section id="page-about" class="page">
      <h1 data-i18n="about.title">关于我们</h1>
      <p data-i18n="about.p1">盒鸽 HcDove成立于2022年，是一个专注于游戏和科技的团队。</p>
      <p data-i18n="about.p2">我们致力于通过技术创新，为用户带来优质的游戏体验和科技产品。</p>
      <p data-i18n="about.p3">感谢您对盒鸽 HcDove的支持与关注！</p>
    </section>
  </main>

  <div class="divider-1px"></div>

  <!-- 底部 -->
  <footer class="footer">
    <div data-i18n="footer.contact">联系我们</div>
    <div class="social-icons">
      <a href="https://space.bilibili.com/1016692202/" title="Bilibili" target="_blank" rel="noopener">
        <img src="/images/bilibili.png" alt="Bilibili" class="social-icon">
      </a>
      <a href="https://www.douyin.com/user/MS4wLjABAAAALiqkpu3Zp8I56vEpV46mEreYBIA2jFqRk-wSPZqOVbE/" title="Douyin" target="_blank" rel="noopener">
        <img src="/images/douyin.png" alt="Douyin" class="social-icon">
      </a>
    </div>
    <div class="font-credit">
      <span data-i18n="footer.font">本网站使用</span>
      <a href="https://hyperos.mi.com/font/" target="_blank" rel="noopener">MiSans</a>
      <span data-i18n="footer.fontSuffix">字体</span>
    </div>
  </footer>

  <script>
/**
 * 多语言单页面应用 (SPA)
 * 统一管理所有语言版本，实现无刷新切换
 */

// ==================== 翻译数据 ====================
const i18n = {
  zh: {
    nav: {
      home: '主页',
      games: '游戏',
      ai: 'AI制作',
      about: '关于'
    },
    home: {
      subtitle: '专注于游戏和科技的团队',
      description: '成立于2022年，致力于为用户带来优质的游戏体验和科技产品'
    },
    games: {
      title: '游戏',
      comingSoon: '更多游戏敬请期待'
    },
    ai: {
      title: 'AI制作'
    },
    about: {
      title: '关于我们',
      p1: '盒鸽 HcDove成立于2022年，是一个专注于游戏和科技的团队。',
      p2: '我们致力于通过技术创新，为用户带来优质的游戏体验和科技产品。',
      p3: '感谢您对盒鸽 HcDove的支持与关注！'
    },
    footer: {
      contact: '联系我们',
      font: '本网站使用',
      fontSuffix: '字体'
    }
  },
  en: {
    nav: {
      home: 'Home',
      games: 'Games',
      ai: 'AI Creation',
      about: 'About'
    },
    home: {
      subtitle: 'Focused on games and technology',
      description: 'Founded in 2022, dedicated to bringing high-quality gaming experiences and technology products'
    },
    games: {
      title: 'Games',
      comingSoon: 'More games coming soon'
    },
    ai: {
      title: 'AI Creation'
    },
    about: {
      title: 'About Us',
      p1: 'HcDove was founded in 2022, focusing on games and technology.',
      p2: 'We are committed to bringing high-quality gaming experiences and technology products to users through technological innovation.',
      p3: 'Thank you for your support and attention to HcDove!'
    },
    footer: {
      contact: 'Contact Us',
      font: 'This website uses',
      fontSuffix: 'font'
    }
  }
};

// ==================== SPA 状态管理 ====================
const App = {
  state: {
    currentLang: 'zh',
    currentPage: 'home'
  },

  // 初始化应用
  init() {
    // 检测浏览器语言
    const browserLang = navigator.language.startsWith('en') ? 'en' : 'zh';
    this.state.currentLang = browserLang;
    
    // 恢复保存的语言偏好
    const savedLang = localStorage.getItem('hcpgn-lang');
    if (savedLang && i18n[savedLang]) {
      this.state.currentLang = savedLang;
    }

    // 设置初始语言
    this.setLanguage(this.state.currentLang);
    
    // 绑定事件
    this.bindEvents();
    
    console.log('[SPA] 初始化完成，当前语言:', this.state.currentLang);
  },

  // 绑定事件
  bindEvents() {
    // 语言切换
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const lang = e.target.dataset.lang;
        this.setLanguage(lang);
      });
    });

    // 导航切换
    document.querySelectorAll('[data-page]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const page = e.target.dataset.page;
        if (page) this.navigateTo(page);
      });
    });

    // 监听语言切换事件（供外部扩展）
    document.addEventListener('langChanged', (e) => {
      console.log('[SPA] 语言已切换至:', e.detail.lang);
    });
  },

  // 设置语言
  setLanguage(lang) {
    if (!i18n[lang]) return;
    
    this.state.currentLang = lang;
    localStorage.setItem('hcpgn-lang', lang);
    
    // 更新 DOM
    this.updateDOM();
    
    // 更新语言切换按钮状态
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });
    
    // 更新 html lang 属性
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en-US';

    // 触发事件
    document.dispatchEvent(new CustomEvent('langChanged', { detail: { lang } }));
  },

  // 更新 DOM 文本内容
  updateDOM() {
    const lang = this.state.currentLang;
    
    // 查找所有带 data-i18n 属性的元素
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      const text = this.getNestedValue(i18n[lang], key);
      if (text !== undefined) {
        el.textContent = text;
      }
    });
  },

  // 获取嵌套对象值
  getNestedValue(obj, path) {
    return path.split('.').reduce((acc, part) => acc && acc[part], obj);
  },

  // 导航到指定页面
  navigateTo(page) {
    if (!document.getElementById(`page-${page}`)) return;
    
    this.state.currentPage = page;
    
    // 隐藏所有页面
    document.querySelectorAll('.page').forEach(p => {
      p.classList.remove('active');
    });
    
    // 显示目标页面
    const targetPage = document.getElementById(`page-${page}`);
    targetPage.classList.add('active');
    
    // 更新导航高亮
    this.updateNavHighlight();
    
    // 滚动到顶部
    window.scrollTo({ top: 0, behavior: 'smooth' });
    
    // 更新页面标题
    this.updatePageTitle();
    
    console.log('[SPA] 导航至:', page);
  },

  // 更新导航高亮
  updateNavHighlight() {
    document.querySelectorAll('[data-page]').forEach(link => {
      const isActive = link.dataset.page === this.state.currentPage;
      link.classList.toggle('active', isActive);
    });
  },

  // 更新页面标题
  updatePageTitle() {
    const lang = this.state.currentLang;
    const page = this.state.currentPage;
    const titles = {
      zh: { home: '盒鸽 HcDove', games: '游戏 - 盒鸽 HcDove', ai: 'AI制作 - 盒鸽 HcDove', about: '关于 - 盒鸽 HcDove' },
      en: { home: 'HcDove', games: 'Games - HcDove', ai: 'AI Creation - HcDove', about: 'About - HcDove' }
    };
    document.title = titles[lang][page] || titles[lang].home;
  }
};

// ==================== 启动应用 ====================
document.addEventListener('DOMContentLoaded', () => {
  App.init();
  
  // 汉堡菜单功能
  const hamburger = document.querySelector('.hamburger');
  const navMenu = document.querySelector('.nav-menu');
  
  if (hamburger && navMenu) {
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      navMenu.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!hamburger.contains(e.target) && !navMenu.contains(e.target)) {
        hamburger.classList.remove('active');
        navMenu.classList.remove('active');
      }
    });
  }
});
  </script>
</body>
</html>
